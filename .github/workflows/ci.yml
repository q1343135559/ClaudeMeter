name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  dist-is-current:
    # plugin/dist/ 提交进仓库供 marketplace 安装，必须和 src/ 保持同步。
    # 这个 job 重新构建一次并比对，防止有人改了 src 却忘了跑 build。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: 检查 plugin/dist/ 是否已同步
        run: |
          if ! git diff --quiet -- plugin/dist/; then
            echo "plugin/dist/ 与 src/ 不同步，请在本地执行 npm run build 后重新提交："
            git diff --stat -- plugin/dist/
            exit 1
          fi

  version-bumped:
    # 拦截本仓库唯一一个"完全没有反馈"的错误：改了会分发给用户的 plugin/ 却没升版本号。
    # Claude Code 用 plugin.json 的 version 作为更新判定的缓存键，版本号没变时
    # 已安装的用户永远收不到改动，而构建、测试、推送全都是绿的。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 改动了 plugin/ 就必须提升版本号
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          node scripts/check-version-bump.mjs "$BASE" HEAD
